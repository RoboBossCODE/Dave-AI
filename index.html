<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10121b"><title>Dave AI · V2</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#10121b;color:#f1f2f7}*{box-sizing:border-box}body{margin:0}.app{max-width:920px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:16px;gap:12px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303448;padding:4px 0 15px}.brand{display:flex;gap:12px;align-items:center}.face{background:#7366f7;border-radius:16px;padding:12px;font-size:24px}h1{font-size:21px;margin:0}small{color:#a9aec2}.actions{display:flex;gap:7px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #3b4059;border-radius:11px;background:#25293b;color:#f4f5ff;padding:10px 12px}button:hover{background:#343955}main{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;padding:8px 2px}.msg{max-width:85%;padding:12px 15px;border-radius:16px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.user{align-self:flex-end;background:#6557d7}.bot{align-self:flex-start;background:#222638;border:1px solid #34384d}.composer{display:flex;gap:9px}textarea{resize:none;flex:1;border:1px solid #40445c;background:#1b1e2d;color:white;padding:13px;border-radius:13px;font:inherit;min-height:48px;max-height:140px}#send{background:#7366f7;border:0;font-weight:700}footer{color:#9ea4bb;font-size:12px;text-align:center}@media(max-width:560px){.app{padding:10px}.msg{max-width:94%}header{align-items:flex-start}.actions button{font-size:12px;padding:8px}}</style></head><body><div class="app"><header><div class="brand"><div class="face">🤖</div><div><h1>Dave AI <small>V2</small></h1><small>Independent · Local · Free</small></div></div><div class="actions"><button id="voice" aria-pressed="false">🔇 Voice</button><button id="export">Export</button><button id="clear">Reset</button></div></header><main id="messages" aria-live="polite"></main><form id="form" class="composer"><textarea id="input" rows="1" placeholder="Ask Dave something…" aria-label="Message Dave"></textarea><button id="send" type="submit">Send</button></form><footer>Runs entirely in your browser. No AI model, server, API or tracking. Dave can make mistakes.</footer></div><script>
'use strict';
const $=id=>document.getElementById(id), STORE='dave-v2-local';
const initial={history:[],facts:{},topic:null,previousIntent:null,voice:false};
let state;try{state={...initial,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{state={...initial}};
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^\p{L}\p{N}'+\-*/().,%!?\s]/gu,' ').replace(/\s+/g,' ').trim();
const words=s=>norm(s).match(/[a-z0-9]+/g)||[];
const contains=(s,...terms)=>terms.some(t=>s.includes(t));
const stop=new Set('a an the is are was were be been being i you he she it they we my your their our of for to in on at from with do does did can could would should will and or but what how why when where who which tell me about please explain give some more that this these those'.split(' '));
const keywords=s=>words(s).filter(w=>!stop.has(w));
const kb=[
{keys:['javascript','js'],name:'JavaScript',description:'JavaScript is a programming language used to add behaviour to web pages. It also runs outside browsers in environments such as Node.js.',example:'Try: const greeting = "Hello"; console.log(greeting);',next:'I can explain variables, functions, arrays, events, or debugging.'},
{keys:['html'],name:'HTML',description:'HTML structures the content of a web page using elements such as headings, paragraphs, links and forms.',example:'Try: <h1>Hello world</h1>',next:'CSS styles HTML, while JavaScript adds interactions.'},
{keys:['css'],name:'CSS',description:'CSS controls the presentation of web pages, including layout, colour, spacing and responsive design.',example:'Try: h1 { color: rebeccapurple; }',next:'Flexbox and Grid are useful for responsive layouts.'},
{keys:['python'],name:'Python',description:'Python is a general-purpose programming language popular for automation, scripting, data analysis and learning.',example:'Try: print("Hello world")',next:'I can help with variables, loops, lists and functions.'},
{keys:['github','github pages'],name:'GitHub Pages',description:'GitHub Pages publishes static websites from a repository. It serves HTML, CSS, JavaScript and assets, but does not run a server-side application.',example:'For a simple site, put index.html in your repository, then enable Pages under repository Settings.',next:'A browser-only chatbot is a good fit for GitHub Pages.'},
{keys:['variable','variables'],name:'Variables',description:'A variable stores a value under a name. In JavaScript, prefer const when the binding will not change, and let when it will.',example:'Example: let score = 0; score += 1;',next:'Want to look at functions or arrays next?'},
{keys:['function','functions'],name:'Functions',description:'A function groups reusable instructions and can accept inputs and return outputs.',example:'Example: function double(n) { return n * 2; }',next:'You can call double(4) to get 8.'},
{keys:['array','arrays'],name:'Arrays',description:'An array is an ordered collection of values. JavaScript arrays are zero-indexed.',example:'Example: const colours = ["red", "blue"]; console.log(colours[0]);',next:'You can loop through arrays with for...of or .map().' },
{keys:['loop','loops'],name:'Loops',description:'A loop repeats code. In JavaScript, for...of is useful for collections, while a for loop is useful when you need an index.',example:'Example: for (const item of [1,2,3]) console.log(item);',next:'Be careful to avoid infinite loops.'},
{keys:['event','events'],name:'Browser events',description:'Events tell JavaScript when something happens, such as a click, keypress or form submission.',example:'Example: button.addEventListener("click", () => alert("Hi"));',next:'Use addEventListener instead of putting inline JavaScript in HTML.'},
{keys:['debug','debugging','error','bug'],name:'Debugging',description:'Debugging means finding and fixing the cause of unexpected behaviour. Start with the browser console, reproduce the issue and isolate the smallest failing example.',example:'Try console.log(value) or set a breakpoint in browser DevTools.',next:'If you paste the error message and the relevant code, I can help with common patterns.'},
{keys:['api'],name:'APIs',description:'An API is an interface through which software components communicate. Web APIs expose browser capabilities, and network APIs exchange data with services.',example:'Example browser API: localStorage.setItem("name", "Dave");',next:'Public browser code cannot safely hide a private API key.'},
{keys:['localstorage','storage'],name:'Local storage',description:'localStorage saves small string values in a browser for a particular site. Data generally persists across reloads but can be cleared by the user.',example:'Example: localStorage.setItem("theme", "dark");',next:'Avoid storing passwords or sensitive secrets there.'},
{keys:['computer','cpu'],name:'CPUs',description:'A CPU executes program instructions. Performance depends on architecture, clock speed, core count, workload and memory.',example:'For a slow program, profile where time is being spent before optimising.',next:'Do you mean hardware performance or programming?'},
{keys:['internet'],name:'The internet',description:'The internet is a global network of interconnected networks using protocols such as IP and TCP. The web is one service built on top of it.',example:'A browser requests a page over HTTP or HTTPS.',next:'DNS translates domain names into addresses.'},
{keys:['dns'],name:'DNS',description:'DNS translates human-readable domain names into records such as IP addresses.',example:'For example, a browser may look up the A or AAAA record for a site.',next:'DNS records can also configure mail and domain verification.'},
{keys:['planet','solar system'],name:'The solar system',description:'Our solar system contains the Sun, eight planets, dwarf planets, moons, asteroids and comets.',example:'The eight planets are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.',next:'Want to know about a particular planet?'},
{keys:['gravity'],name:'Gravity',description:'Gravity is the attraction associated with mass and energy. Near Earth’s surface, free-falling objects accelerate at roughly 9.81 m/s² if air resistance is ignored.',example:'Weight is mass multiplied by local gravitational acceleration.',next:'I can explain the difference between mass and weight.'},
{keys:['photosynthesis'],name:'Photosynthesis',description:'Photosynthesis lets plants, algae and some microbes convert light energy into chemical energy. Oxygenic photosynthesis uses water and carbon dioxide and releases oxygen.',example:'A simplified equation is 6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂.',next:'Want a simpler explanation?'},
{keys:['water'],name:'Water',description:'Water is H₂O, a molecule with two hydrogen atoms and one oxygen atom. Pure water freezes at about 0°C and boils at about 100°C at standard atmospheric pressure.',example:'Those temperatures change with pressure and dissolved substances.',next:'Ask me about its properties or the water cycle.'},
{keys:['earth'],name:'Earth',description:'Earth is the third planet from the Sun and the only world currently known to host life.',example:'One rotation relative to the Sun takes approximately 24 hours.',next:'Want to discuss the atmosphere, oceans or orbit?'},
{keys:['moon'],name:'The Moon',description:'The Moon is Earth’s natural satellite. Its phases result from the changing portion of its sunlit half visible from Earth.',example:'The lunar phase cycle lasts about 29.5 days.',next:'I can explain eclipses too.'},
{keys:['ai','artificial intelligence'],name:'Artificial intelligence',description:'Artificial intelligence is a broad field focused on systems that perform tasks associated with intelligence, such as classification, prediction and language processing.',example:'A rule-based chatbot like me uses programmed patterns and logic rather than a trained language model.',next:'I can compare rule-based bots with language models.'}
];
const followups=[/^(why|how|what about|and|explain more|tell me more|more|example|give an example|can you explain)(\b|\?)/i];
function topicFor(s){let best=null,score=0;const ws=keywords(s);for(const item of kb){let n=0;for(const key of item.keys){if(norm(s).includes(key))n+=key.includes(' ')?3:2;else if(ws.includes(key))n++}if(n>score){score=n;best=item}}return score?best:null}
function speak(t){if(!state.voice||!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,''));u.rate=1.04;speechSynthesis.speak(u)}
function add(role,text,store=true){const div=document.createElement('div');div.className='msg '+(role==='user'?'user':'bot');div.textContent=text;$('messages').append(div);$('messages').scrollTop=$('messages').scrollHeight;if(store){state.history.push({role,text});state.history=state.history.slice(-100);save()}if(role==='bot'&&store)speak(text)}
function number(x){return Number(x.replace(/,/g,''))}
function calc(expression){const e=expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/,/g,'');if(e.length>110||!/^[\d\s.+*/()%\-]+$/.test(e))return null;try{const tokens=e.match(/\d*\.?\d+(?:e[+-]?\d+)?|\*\*|[()+*/%\-]/gi);if(!tokens||tokens.join('')!==e.replace(/\s/g,''))return null;let p=0;function atom(){const t=tokens[p++];if(t==='-')return -atom();if(t==='+')return atom();if(t==='('){const v=expr();if(tokens[p++]!==')')throw Error();return v}const v=Number(t);if(!Number.isFinite(v))throw Error();return v}function power(){let a=atom();if(tokens[p]==='**'){p++;a=Math.pow(a,power())}return a}function mult(){let a=power();while(['*','/','%'].includes(tokens[p])){const op=tokens[p++],b=power();a=op==='*'?a*b:op==='/'?a/b:a%b}return a}function expr(){let a=mult();while(['+','-'].includes(tokens[p])){const op=tokens[p++],b=mult();a=op==='+'?a+b:a-b}return a}const value=expr();return p===tokens.length&&Number.isFinite(value)&&Math.abs(value)<1e18?Number(value.toPrecision(12)):null}catch{return null}}
function respond(raw){const s=norm(raw),w=words(s);let m,topic=topicFor(s);const prev=state.topic?kb.find(x=>x.name===state.topic):null;
if(/^(hi|hello|hey|hiya|yo|good morning|good evening|good afternoon)[!. ]*$/.test(s))return pick(['Hey! What are we working on?','Hello. Dave reporting for duty. What can I help with?','Hi! Ask me something, or give me a task.']);
if(/^(thanks|thank you|cheers|ty)[!. ]*$/.test(s))return pick(['You’re welcome!','No problem. Anything else?','Happy to help.']);
if(/^(bye|goodbye|see you|later)[!. ]*$/.test(s))return 'See you later! Your chat stays saved in this browser.';
if(contains(s,'who are you','what are you','your name'))return 'I’m Dave, a local JavaScript chatbot. I can hold simple context, explain topics from my built-in knowledge, calculate, convert units and remember facts you tell me. I’m not a generative language model, so I won’t pretend I know everything.';
if(contains(s,'what can you do','help me','show commands','capabilities'))return 'I can explain web development and some general science, answer follow-ups, do maths (try “calculate (18+7)*4”), convert units (try “12 km to miles”), remember your name (“my name is Alex”), roll dice, flip coins, tell jokes and work with text (try “reverse: hello”). I’m still a rule-based chatbot, not a full AI model.';
if((m=s.match(/(?:my name is|call me|i am called) ([a-z][a-z'-]{1,30})/i))){state.facts.name=m[1].replace(/^./,c=>c.toUpperCase());return `Nice to meet you, ${state.facts.name}. I’ll remember that in this browser.`}
if(contains(s,'what is my name','do you know my name','remember my name'))return state.facts.name?`You told me your name is ${state.facts.name}.`:'You haven’t told me your name yet. Say “my name is …” and I’ll remember.';
if((m=raw.match(/^remember (?:that )?(.{3,160})$/i))){const fact=m[1].trim();state.facts.note=fact;return `I’ll keep this note locally: “${fact}”.`}
if(contains(s,'what did i ask you to remember','what do you remember','my saved note'))return state.facts.note?`Your saved note is: ${state.facts.note}`:'I don’t have a saved note yet. Try “remember that I prefer dark mode”.';
if(contains(s,'forget my name')){delete state.facts.name;return 'I’ve cleared your saved name.'}
if(contains(s,'forget my note')){delete state.facts.note;return 'I’ve cleared your saved note.'}
if(/\b(joke|make me laugh|something funny)\b/.test(s))return pick(['Why do programmers prefer dark mode? Because light attracts bugs.','I told my computer I needed a break. It said: “No problem, I’ll go to sleep.”','There are 10 kinds of people: those who understand binary, and those who don’t.']);
if(/\b(flip a coin|coin toss|heads or tails)\b/.test(s))return `I flipped a coin: ${pick(['heads','tails'])}.`;
if(/\b(roll|dice|die)\b/.test(s)){const sides=Math.min(1000,Math.max(2,Number(s.match(/d(\d+)|(?:sided|sides)\s*(\d+)/)?.[1]||s.match(/d(\d+)|(?:sided|sides)\s*(\d+)/)?.[2]||6)));return `🎲 d${sides}: ${1+Math.floor(Math.random()*sides)}.`}
if((m=raw.match(/^(?:reverse|reverse text)\s*:\s*(.+)$/i)))return [...m[1]].reverse().join('');
if((m=raw.match(/^(?:uppercase|upper case)\s*:\s*(.+)$/i)))return m[1].toUpperCase();
if((m=raw.match(/^(?:lowercase|lower case)\s*:\s*(.+)$/i)))return m[1].toLowerCase();
if((m=s.match(/(?:convert\s+)?(-?\d+(?:\.\d+)?)\s*(km|kilometers?|kilometres?|miles?|mi|kg|kilograms?|lbs?|pounds?|celsius|fahrenheit|°c|°f|cm|inches?|inch|feet|ft)\s+(?:to|in|into)\s+(km|kilometers?|kilometres?|miles?|mi|kg|kilograms?|lbs?|pounds?|celsius|fahrenheit|°c|°f|cm|inches?|inch|feet|ft)/))){const v=Number(m[1]),unit=x=>/^(km|kilo)/.test(x)?'km':/^(mi|mile)/.test(x)?'mi':/^(kg|kilog)/.test(x)?'kg':/^(lb|pound)/.test(x)?'lb':/^(celsius|°c)/.test(x)?'c':/^(fahrenheit|°f)/.test(x)?'f':/^cm/.test(x)?'cm':/^(inch|inches)/.test(x)?'in':'ft',a=unit(m[2]),b=unit(m[3]);const rules={'km:mi':x=>x/1.609344,'mi:km':x=>x*1.609344,'kg:lb':x=>x*2.20462262,'lb:kg':x=>x/2.20462262,'c:f':x=>x*9/5+32,'f:c':x=>(x-32)*5/9,'cm:in':x=>x/2.54,'in:cm':x=>x*2.54,'ft:in':x=>x*12,'in:ft':x=>x/12};const result=a===b?v:rules[a+':'+b]?.(v);return result===undefined?`I don't have a direct conversion for ${m[2]} to ${m[3]} yet.`:`${v} ${a} = ${Number(result.toPrecision(8))} ${b}.`}
if(/\b(time|date|today|day of the week)\b/.test(s)&&/\b(what|current|tell|today|now)\b/.test(s))return `Your device reports: ${new Date().toLocaleString(undefined,{dateStyle:'full',timeStyle:'short'})}.`;
const math=s.match(/^(?:calculate|compute|solve|what is|what's)\s+([\d\s.+*/()%\-^×÷,]+)\??$/i);if(math){const result=calc(math[1].replace(/\?$/,''));return result===null?'I couldn’t safely evaluate that expression. Try “calculate (12+3)*4”.':`That comes to ${result}.`}
if(topic){state.topic=topic.name;const asksExample=/\b(example|show me|sample|code)\b/.test(s),asksMore=/\b(more|detail|elaborate|further)\b/.test(s);return asksExample?`${topic.name}: ${topic.example}\n\n${topic.next}`:asksMore?`${topic.description}\n\n${topic.example}\n\n${topic.next}`:`${topic.description}\n\n${pick([topic.next,topic.example])}`}
if(prev&&followups.some(re=>re.test(s))){if(/\b(example|show)\b/.test(s))return `Sure — continuing with ${prev.name}. ${prev.example}`;return `We were talking about ${prev.name}. ${prev.description}\n\n${prev.example}\n\n${prev.next}`}
if(contains(s,'how are you','how is it going'))return pick(['Doing well, thanks. What’s on your mind?','All systems operational. Mostly. What can I do for you?']);
if(contains(s,'are you real','are you intelligent','are you ai'))return 'I’m real software, but not a language model. I recognise patterns, track limited context and generate replies from structured information. I can’t reason freely like ChatGPT.';
const important=keywords(s).slice(0,5).join(', ');
return pick([`I’m not confident I understood${important?` the part about “${important}”`:''}. Could you ask that a different way or tell me the specific task?`,`I don’t have a reliable answer for that yet. I can help with coding basics, maths, conversions and a few science topics. What would you like to do with it?`,`I think I’m missing some context. Are you asking for an explanation, an example, or help solving a problem?`]);
}
function submit(){const raw=$('input').value.trim();if(!raw)return;$('input').value='';add('user',raw);let answer;try{answer=respond(raw)}catch(e){console.error(e);answer='Something went wrong while processing that. Please try rephrasing.'}add('bot',answer);save()}
$('form').addEventListener('submit',e=>{e.preventDefault();submit()});$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
$('voice').addEventListener('click',()=>{state.voice=!state.voice;$('voice').textContent=state.voice?'🔊 Voice':'🔇 Voice';$('voice').setAttribute('aria-pressed',String(state.voice));if(!state.voice&&'speechSynthesis'in window)speechSynthesis.cancel();save()});
$('clear').addEventListener('click',()=>{if(!confirm('Erase Dave’s conversation and saved facts from this browser?'))return;state=structuredClone(initial);save();$('messages').replaceChildren();$('voice').textContent='🔇 Voice';add('bot','Fresh start. Hey, I’m Dave. What can I help you with?')});
$('export').addEventListener('click',()=>{const data=state.history.map(x=>`${x.role==='user'?'You':'Dave'}: ${x.text}`).join('\n\n');const url=URL.createObjectURL(new Blob([data],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='dave-chat.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('voice').textContent=state.voice?'🔊 Voice':'🔇 Voice';$('voice').setAttribute('aria-pressed',String(state.voice));if(state.history.length){for(const item of state.history)add(item.role,item.text,false)}else add('bot','Hey, I’m Dave V2. I run completely in your browser. Ask about JavaScript, HTML, science, or try a calculation. What are we doing today?');
</script></body></html>
