<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10121a"><title>Dave AI</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="avatar">D</div><div><h1>Dave <span>AI</span></h1><p id="status">Ready to chat</p></div><div class="actions"><button id="voice" title="Toggle spoken replies" aria-label="Toggle spoken replies">🔇</button><button id="clear" title="Clear conversation" aria-label="Clear conversation">↺</button></div></header><section id="chat" role="log" aria-live="polite" aria-label="Conversation"></section><div class="suggestions" id="suggestions"><button data-prompt="Who was Ada Lovelace?">Who was Ada Lovelace?</button><button data-prompt="What is photosynthesis?">What is photosynthesis?</button><button data-prompt="Calculate (25 + 17) * 3">Calculate (25 + 17) × 3</button><button data-prompt="Tell me a joke">Tell me a joke</button></div><form id="form"><label class="sr" for="message">Message Dave</label><textarea id="message" rows="1" placeholder="Ask Dave anything…" maxlength="1200" required></textarea><button id="send" type="submit" aria-label="Send message">➤</button></form><footer>Free • No accounts • Powered by JavaScript and public knowledge sources</footer></main><script src="script.js" defer></script></body></html>
