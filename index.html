<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Dave AI</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8edf8;background:#090e1a}*{box-sizing:border-box}body{margin:0}.app{display:flex;height:100dvh;max-width:1100px;margin:auto}.side{width:255px;background:#101729;border-right:1px solid #273249;padding:22px;display:flex;flex-direction:column;gap:16px}.brand{font-weight:850;font-size:25px;letter-spacing:-1px}.brand span{color:#8f9bff}.muted{color:#98a6c3;font-size:13px;line-height:1.5}.side button,.actions button{background:#1a2640;color:#eaf0ff;border:1px solid #34405b;padding:11px;border-radius:12px;cursor:pointer;text-align:left}.side button:hover,.actions button:hover{background:#293858}.side .bottom{margin-top:auto}.main{display:flex;flex:1;flex-direction:column;min-width:0}.top{padding:17px 22px;border-bottom:1px solid #273249;display:flex;align-items:center;justify-content:space-between}.status{font-size:12px;color:#9de5bd}.messages{flex:1;overflow-y:auto;padding:28px 24px;display:flex;flex-direction:column;gap:18px}.bubble{max-width:min(80%,680px);padding:13px 17px;border-radius:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.dave{align-self:flex-start;background:#18223a;border:1px solid #293956}.user{align-self:flex-end;background:#5557c9}.who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:5px}.composer{padding:14px 22px 22px;display:flex;gap:10px;border-top:1px solid #273249}input{flex:1;min-width:0;background:#151e31;color:#fff;border:1px solid #34405b;border-radius:14px;padding:15px;font:inherit;outline:none}input:focus{border-color:#8f9bff}#send{background:#7b7df2;color:#fff;border:0;border-radius:14px;padding:0 20px;font-weight:700;cursor:pointer}.tip{padding:0 22px 12px;text-align:center;color:#8190ae;font-size:11px}@media(max-width:650px){.side{display:none}.messages{padding:18px 12px}.bubble{max-width:90%}.composer{padding:12px}.top{padding:15px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">DAVE <span>AI</span></div><div class="muted">Your slightly sarcastic, entirely browser-powered assistant.</div><button id="new">＋ New conversation</button><button id="export">↓ Export conversation</button><button id="clear">✕ Clear saved memory</button><div class="bottom muted">100% JavaScript · No API · No backend<br>Conversations stay on this device.</div></aside><main class="main"><header class="top"><strong>Chat with Dave</strong><div class="actions"><button id="voice" aria-pressed="false">🔇 Voice off</button> <span class="status">● Local mode</span></div></header><section class="messages" id="messages" aria-live="polite"></section><form class="composer" id="form"><input id="input" autocomplete="off" maxlength="1500" placeholder="Ask Dave something..." aria-label="Your message"><button id="send" type="submit">Send</button></form><div class="tip">Dave is a rule-based chatbot, not a generative AI. He can be wrong.</div></main></div><script src="script.js"></script></body></html>
